# Бесплатная альтернатива Vercel Cron: на Hobby-плане Vercel запускает крон
# только раз в сутки, а тендеры так не мониторят. GitHub Actions даёт
# нужную частоту без доплат.
#
# Настройка: Settings → Secrets and variables → Actions → New repository secret
#   CRON_URL = https://tenderbot-blond.vercel.app/api/cron?secret=<ваш CRON_SECRET>
name: Проверка тендеров

on:
  schedule:
    # Каждые 15 минут. GitHub может задержать запуск на несколько минут
    # при высокой нагрузке — для мониторинга тендеров это некритично.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Запустить обход площадок
        run: |
          code=$(curl -s -o response.json -w "%{http_code}" --max-time 300 "${{ secrets.CRON_URL }}")
          echo "HTTP $code"
          cat response.json
          # Падаем, если бот ответил ошибкой — иначе поломка останется незамеченной.
          test "$code" = "200"
